[package]
name = "clientadvance-desktop"
version = "0.1.0"
description = "ClientAdvance desktop shell"
edition = "2021"

[lib]
name = "gestion_facile_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "native-tls"] }
rand = "0.8"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
